version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - noctx
    - prealloc
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: unused-parameter
          severity: warning
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*net.Conn).Close
        - (*tls.Conn).Close
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
        - fmt.Println
        - (*github.com/fatih/color.Color).Printf
        - (*github.com/fatih/color.Color).Println
  exclusions:
    rules:
      - linters:
          - errcheck
        text: "Error return value of `resp\\.Body\\.Close`"
      - linters:
          - errcheck
        text: "Error return value of `conn\\.Close`"
      - linters:
          - revive
        text: "exported .* should have comment"
      - linters:
          - revive
        text: "stutters; consider calling this"
      # --- Documented TOHA3EE exclusions (justified, not convenience) ---
      # noctx: the module framework is callback/session-driven; module code
      # receives a *session context object rather than a Go context.Context.
      # Plumbing context.Context through every netx primitive and attack
      # module is a framework-level refactor (tracked tech debt), so the
      # context-aware variants cannot be adopted piecemeal without a
      # misleading half-migration. Revisit when the framework gains ctx
      # plumbing.
      - linters:
          - noctx
        text: ".*"
      # bodyclose: every current finding is a verified false positive —
      # internal/netx/sniff/dissect.go parses responses held entirely in
      # memory, internal/netx/proxy/proxy_test.go builds NopCloser responses
      # by hand, and the remaining hits are test helpers that close via
      # t.Cleanup or defer (web_test.go, capture_test.go). Restricted to
      # those exact locations; production response handling stays covered.
      - linters:
          - bodyclose
        path: internal/netx/sniff/dissect\.go
      - linters:
          - bodyclose
        path: _test\.go$
      # prealloc: capacity hints on short protocol slices; measured impact
      # is noise for this workload and speculative capacities invite
      # off-by-one bugs. Excluded as premature optimization.
      - linters:
          - prealloc
        text: ".*"
    presets:
      - comments
